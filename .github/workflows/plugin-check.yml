name: Plugin check

on:
  push:
    # develop: where a change is pushed first, so main receives it only once CI is green.
    branches: [main, release, develop]
  pull_request:
    branches: [main, release]
  # Once a week too: the Windows job checks MEGA's current installer against the signer this
  # connector accepts, so a change of MEGA's certificate is noticed without a push.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to commits: a moved tag cannot change what runs here.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # No token left in .git/config while dependencies' install scripts run.
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Bundle matches src/, versions match, marketplace entry is valid, bundle starts standalone,
      # the Codex launcher (bin/mega-mcp) finds Node.
      - run: npm run check:plugin
      # The checks compare the committed files with fresh builds; none may have been rewritten.
      - run: test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

  # What only Windows can check. The Codex plugin's launcher, bin/mega-mcp.cmd: started the way
  # Codex starts it, it must find Node in each place it promises and serve the tools (it runs
  # the checked-in bundle). And the signature check of MEGAcmd for Windows, against MEGA's
  # current installer. scripts/release-plugin.mjs requires this job too.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: node scripts/check-launcher.mjs
      # MEGA's official installer (downloaded, never run) must pass the server's own signature
      # check, and a program signed by someone else must not.
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-windows-signer.mjs
